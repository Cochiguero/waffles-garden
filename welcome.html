<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Waffle & Bestie</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:      #3A7FD4;
      --primary-deep: #2A5FA4;
      --navy:         #1A2F5A;
      --accent:       #E8651A;
      --accent-deep:  #C84E10;
      --bg:           #FFFFFF;
      --card:         #F4F8FF;
      --subtext:      #6A8AAA;
      --border:       #D0E4F8;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      width:100%; height:100%;
      font-family:'Nunito', sans-serif;
      background:var(--bg);
      overflow-x:hidden;
    }

    /* ── BACKGROUND SHAPES ── */
    .bg-shape {
      position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    }
    .bg-shape-1 {
      width:320px; height:320px;
      background:rgba(58,127,212,.07);
      top:-80px; right:-80px;
    }
    .bg-shape-2 {
      width:220px; height:220px;
      background:rgba(232,101,26,.06);
      bottom:120px; left:-60px;
    }
    .bg-shape-3 {
      width:140px; height:140px;
      background:rgba(58,127,212,.05);
      bottom:60px; right:20px;
    }

    /* ── LAYOUT ── */
    .screen {
      position:relative; z-index:1;
      min-height:100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:space-between;
      padding:48px 28px 40px;
      max-width:420px; margin:0 auto;
    }

    /* ── TOP SECTION ── */
    .top { display:flex; flex-direction:column; align-items:center; gap:0; }

    /* ── LOGO ── */
    .logo-wrap { width:260px; margin-bottom:4px; }
    .logo-wrap img { width:100%; height:auto; display:block; }

    /* ── TAGLINE ── */
    .tagline {
      font-size:13px; color:var(--subtext);
      letter-spacing:3px; text-transform:uppercase;
      font-weight:600; margin-top:8px;
    }

    /* ── HERO AREA ── */
    .hero { display:flex; flex-direction:column; align-items:center; gap:12px; margin:32px 0; }

    .hero-badge {
      display:flex; align-items:center; gap:8px;
      background:var(--card); border:1px solid var(--border);
      border-radius:50px; padding:8px 18px;
    }
    .hero-badge-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--accent);
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(1.3); }
    }
    .hero-badge-text {
      font-size:12px; font-weight:700; color:var(--primary);
      letter-spacing:1px; text-transform:uppercase;
    }

    .hero-title {
      font-size:28px; font-weight:800; color:var(--navy);
      text-align:center; line-height:1.25;
    }
    .hero-title span { color:var(--primary); }

    .hero-sub {
      font-size:15px; color:var(--subtext);
      text-align:center; line-height:1.6;
      max-width:300px;
    }

    /* ── FEATURES PILLS ── */
    .features {
      display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
      margin-top:4px;
    }
    .feature-pill {
      display:flex; align-items:center; gap:6px;
      background:var(--card); border:1px solid var(--border);
      border-radius:50px; padding:6px 14px;
      font-size:12px; font-weight:700; color:var(--primary);
    }

    /* ── BUTTONS ── */
    .buttons { width:100%; display:flex; flex-direction:column; gap:14px; }

    .btn {
      width:100%; padding:18px 24px;
      border:none; border-radius:20px;
      font-family:'Nunito', sans-serif;
      font-size:17px; font-weight:800;
      cursor:pointer;
      display:flex; align-items:center; justify-content:space-between;
      transition:transform .15s, box-shadow .15s;
      text-decoration:none;
    }
    .btn:active { transform:scale(.97); }

    .btn-waffle {
      background:var(--navy);
      color:#fff;
      box-shadow:0 4px 20px rgba(26,47,90,.22);
    }
    .btn-waffle:active { box-shadow:0 2px 10px rgba(26,47,90,.15); }

    .btn-bestie {
      background:var(--accent);
      color:#fff;
      box-shadow:0 4px 20px rgba(232,101,26,.28);
    }
    .btn-bestie:active { box-shadow:0 2px 10px rgba(232,101,26,.15); }

    .btn-left { display:flex; flex-direction:column; gap:2px; text-align:left; }
    .btn-label { font-size:17px; font-weight:800; }
    .btn-sub   { font-size:12px; font-weight:600; opacity:.75; }
    .btn-icon  { font-size:26px; }

    /* ── DIVIDER ── */
    .divider {
      display:flex; align-items:center; gap:12px;
      width:100%; margin:2px 0;
    }
    .divider-line { flex:1; height:1px; background:var(--border); }
    .divider-text { font-size:12px; color:var(--subtext); font-weight:600; }

    /* ── LOGIN ── */
    .login-wrap { width:100%; }

    .login-selector {
      display:flex; background:var(--card);
      border:1px solid var(--border);
      border-radius:16px; padding:4px;
      margin-bottom:12px;
    }
    .login-tab {
      flex:1; padding:10px 8px;
      border:none; background:transparent;
      border-radius:12px;
      font-family:'Nunito', sans-serif;
      font-size:13px; font-weight:700;
      color:var(--subtext); cursor:pointer;
      transition:background .2s, color .2s;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .login-tab.active {
      background:#fff;
      box-shadow:0 2px 8px rgba(58,127,212,.12);
    }
    .login-tab.active.waffle { color:var(--navy); }
    .login-tab.active.bestie { color:var(--accent); }

    .btn-login {
      width:100%; padding:16px;
      border:2px solid var(--border);
      border-radius:16px;
      background:#fff;
      font-family:'Nunito', sans-serif;
      font-size:16px; font-weight:800;
      cursor:pointer;
      transition:border-color .2s, color .2s, transform .15s;
      color:var(--navy);
    }
    .btn-login:active { transform:scale(.97); }
    .btn-login.waffle-login  { border-color:var(--navy);   color:var(--navy); }
    .btn-login.bestie-login { border-color:var(--accent);  color:var(--accent); }

    /* ── FOOTER ── */
    .footer {
      font-size:11px; color:var(--subtext);
      text-align:center; line-height:1.6;
      margin-top:16px;
    }
    .footer a { color:var(--primary); text-decoration:none; font-weight:700; }

  </style>
</head>

          <button class="login-tab bestie" id="tabBestie" onclick="selectTab('bestie')">
            🦺 Log in as Bestie
          </button>
        </div>
        <button class="btn-login waffle-login" id="loginBtn" onclick="alert('Login — coming soon!')">
          Log In as Waffle
        </button>
      </div>

      <div class="footer">
        By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
      </div>

    </div>
  </div>

  <script>
    var current = 'waffle';

    function selectTab(type) {
      current = type;
      var tabW = document.getElementById('tabWaffle');
      var tabB = document.getElementById('tabBestie');
      var btn  = document.getElementById('loginBtn');

      tabW.classList.remove('active');
      tabB.classList.remove('active');

      if (type === 'waffle') {
        tabW.classList.add('active');
        btn.className = 'btn-login waffle-login';
        btn.textContent = 'Log In as Waffle';
      } else {
        tabB.classList.add('active');
        btn.className = 'btn-login bestie-login';
        btn.textContent = 'Log In as Bestie';
      }
    }
  </script>

</body>
</html>
