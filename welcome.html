<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Waffle & Bestie</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:      #3A7FD4;
      --primary-deep: #2A5FA4;
      --navy:         #1A2F5A;
      --accent:       #E8651A;
      --accent-deep:  #C84E10;
      --bg:           #FFFFFF;
      --card:         #F4F8FF;
      --subtext:      #6A8AAA;
      --border:       #D0E4F8;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      width:100%; height:100%;
      font-family:'Nunito', sans-serif;
      background:var(--bg);
      overflow:hidden;
    }

    /* ── BACKGROUND SHAPES ── */
    .bg-shape {
      position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    }
    .bg-shape-1 { width:320px; height:320px; background:rgba(58,127,212,.07); top:-80px; right:-80px; }
    .bg-shape-2 { width:220px; height:220px; background:rgba(232,101,26,.06); bottom:120px; left:-60px; }
    .bg-shape-3 { width:140px; height:140px; background:rgba(58,127,212,.05); bottom:60px; right:20px; }

    /* ── APP WRAPPER ── */
    .app {
      position:relative; z-index:1;
      width:100%; max-width:420px;
      height:100vh;
      margin:0 auto;
      overflow:hidden;
    }

    /* ── SCREENS ── */
    .screen {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      overflow-y:auto;
      padding:48px 28px 40px;
      display:flex; flex-direction:column;
      align-items:center;
      transition:transform .38s cubic-bezier(.4,0,.2,1), opacity .38s;
      will-change:transform;
    }

    /* Screen 1: role selection — default visible */
    #screenRole {
      transform:translateX(0);
      opacity:1;
    }
    #screenRole.out {
      transform:translateX(-110%);
      opacity:0;
    }

    /* Screen 2: login — default off-screen right */
    #screenLogin {
      transform:translateX(110%);
      opacity:0;
    }
    #screenLogin.in {
      transform:translateX(0);
      opacity:1;
    }

    /* ══════════════════════════════
       SCREEN 1 — ROLE SELECTION
    ══════════════════════════════ */

    .top {
      display:flex; flex-direction:column;
      align-items:center;
      margin-bottom:24px;
    }

    .logo-wrap { width:200px; }
    .logo-wrap img { width:100%; height:auto; display:block; }

    .tagline {
      font-size:12px; color:var(--subtext);
      letter-spacing:3px; text-transform:uppercase;
      font-weight:600; margin-top:8px;
    }

    .hero-badge {
      display:flex; align-items:center; gap:8px;
      background:var(--card); border:1px solid var(--border);
      border-radius:50px; padding:7px 16px;
      margin-bottom:24px;
      align-self:center;
    }
    .hero-badge-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--accent);
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(1.3); }
    }
    .hero-badge-text {
      font-size:12px; font-weight:700; color:var(--primary);
      letter-spacing:1px; text-transform:uppercase;
    }

    /* ── ROLE CARDS ── */
    .role-cards {
      width:100%;
      display:flex; flex-direction:column; gap:14px;
      margin-bottom:20px;
    }

    .role-card {
      width:100%; padding:22px 24px;
      border:none; border-radius:22px;
      font-family:'Nunito', sans-serif;
      cursor:pointer;
      display:flex; align-items:center; justify-content:space-between;
      transition:transform .15s, box-shadow .15s;
      text-align:left;
    }
    .role-card:active { transform:scale(.97); }

    .card-waffle {
      background:var(--navy);
      color:#fff;
      box-shadow:0 6px 24px rgba(26,47,90,.22);
    }
    .card-bestie {
      background:var(--accent);
      color:#fff;
      box-shadow:0 6px 24px rgba(232,101,26,.28);
    }

    .card-left { display:flex; flex-direction:column; gap:3px; }
    .card-emoji { font-size:30px; margin-bottom:6px; line-height:1; }
    .card-title { font-size:19px; font-weight:800; }
    .card-sub   { font-size:12px; font-weight:600; opacity:.75; }
    .card-arrow { font-size:24px; opacity:.7; }

    /* ── FEATURES ── */
    .features {
      display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
      margin-bottom:20px;
      align-self:center;
    }
    .feature-pill {
      display:flex; align-items:center; gap:5px;
      background:var(--card); border:1px solid var(--border);
      border-radius:50px; padding:6px 13px;
      font-size:11px; font-weight:700; color:var(--primary);
    }

    /* ── DIVIDER ── */
    .divider {
      display:flex; align-items:center; gap:12px;
      width:100%; margin-bottom:14px;
    }
    .divider-line { flex:1; height:1px; background:var(--border); }
    .divider-text { font-size:12px; color:var(--subtext); font-weight:600; white-space:nowrap; }

    /* ── QUICK LOGIN ── */
    .quick-login { width:100%; display:flex; gap:10px; }

    .q-btn {
      flex:1; padding:13px 8px;
      border-radius:14px; border:1.5px solid var(--border);
      background:#fff;
      font-family:'Nunito', sans-serif;
      font-size:13px; font-weight:700;
      color:var(--subtext);
      cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:6px;
      transition:border-color .2s, color .2s, transform .15s;
    }
    .q-btn:active { transform:scale(.97); }
    .q-btn.q-waffle { border-color:var(--navy); color:var(--navy); }
    .q-btn.q-bestie { border-color:var(--accent); color:var(--accent); }

    /* ── FOOTER ── */
    .footer {
      font-size:11px; color:var(--subtext);
      text-align:center; line-height:1.6;
      margin-top:18px; width:100%;
    }
    .footer a { color:var(--primary); text-decoration:none; font-weight:700; }

    /* ══════════════════════════════
       SCREEN 2 — LOGIN / REGISTER
    ══════════════════════════════ */

    .login-header {
      width:100%;
      display:flex; align-items:center; gap:12px;
      margin-bottom:28px;
    }

    .back-btn {
      width:42px; height:42px; flex-shrink:0;
      border:none; border-radius:13px;
      background:var(--card);
      font-size:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s, background .15s;
    }
    .back-btn:active { transform:scale(.93); background:var(--border); }

    .role-badge {
      flex:1;
      display:flex; align-items:center; gap:10px;
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:10px 14px;
    }
    .role-badge-emoji { font-size:22px; line-height:1; }
    .role-badge-info  { display:flex; flex-direction:column; gap:1px; }
    .role-badge-label {
      font-size:10px; font-weight:700;
      color:var(--subtext); text-transform:uppercase; letter-spacing:1px;
    }
    .role-badge-name {
      font-size:15px; font-weight:800;
    }
    .role-badge-name.c-waffle { color:var(--navy); }
    .role-badge-name.c-bestie { color:var(--accent); }

    /* ── MODE TABS ── */
    .mode-tabs {
      width:100%;
      display:flex; background:var(--card);
      border:1px solid var(--border);
      border-radius:16px; padding:4px;
      margin-bottom:22px;
    }
    .mode-tab {
      flex:1; padding:11px 8px;
      border:none; background:transparent;
      border-radius:12px;
      font-family:'Nunito', sans-serif;
      font-size:14px; font-weight:700;
      color:var(--subtext); cursor:pointer;
      transition:background .2s, color .2s, box-shadow .2s;
    }
    .mode-tab.active {
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }
    .mode-tab.active.t-waffle { color:var(--navy); }
    .mode-tab.active.t-bestie { color:var(--accent); }

    /* ── FORM ── */
    .form { width:100%; display:flex; flex-direction:column; gap:14px; }

    .field { display:flex; flex-direction:column; gap:6px; }
    .field-label {
      font-size:11px; font-weight:700; color:var(--subtext);
      text-transform:uppercase; letter-spacing:1px;
    }
    .field-input {
      width:100%; padding:15px 16px;
      border:1.5px solid var(--border);
      border-radius:14px;
      font-family:'Nunito', sans-serif;
      font-size:15px; font-weight:600;
      color:var(--navy); background:#fff;
      outline:none;
      transition:border-color .2s;
      -webkit-appearance:none;
    }
    .field-input.fi-waffle:focus { border-color:var(--navy); }
    .field-input.fi-bestie:focus { border-color:var(--accent); }

    .btn-submit {
      width:100%; padding:17px;
      border:none; border-radius:16px;
      font-family:'Nunito', sans-serif;
      font-size:16px; font-weight:800;
      color:#fff; cursor:pointer;
      margin-top:4px;
      transition:transform .15s, box-shadow .15s;
    }
    .btn-submit:active { transform:scale(.97); }
    .btn-submit.s-waffle {
      background:var(--navy);
      box-shadow:0 4px 20px rgba(26,47,90,.22);
    }
    .btn-submit.s-bestie {
      background:var(--accent);
      box-shadow:0 4px 20px rgba(232,101,26,.28);
    }

    .name-field { display:none; }
    .name-field.show { display:flex; }
  </style>
</head>

      <div class="hero-badge">
        <div class="hero-badge-dot"></div>
        <div class="hero-badge-text">Now in El Paso, TX</div>
      </div>

      <div class="role-cards">
        <button class="role-card card-waffle" onclick="goToLogin('waffle')">
          <div class="card-left">
            <div class="card-emoji">🐶</div>
            <div class="card-title">I'm a Waffle</div>
            <div class="card-sub">My pet is looking for a Bestie</div>
          </div>
          <div class="card-arrow">→</div>
        </button>

        <button class="role-card card-bestie" onclick="goToLogin('bestie')">
          <div class="card-left">
            <div class="card-emoji">🦺</div>
            <div class="card-title">I'm a Bestie</div>
            <div class="card-sub">I want to walk and care for Waffles</div>
          </div>
          <div class="card-arrow">→</div>
        </button>

      </div>

        <div class="divider-text">already have an account?</div>
        <div class="divider-line"></div>
      </div>

      <div class="quick-login">
        <button class="q-btn q-waffle" onclick="goToLogin('waffle','login')">🐶 Log in as Waffle</button>
        <button class="q-btn q-bestie" onclick="goToLogin('bestie','login')">🦺 Log in as Bestie</button>
      </div>

      </div>

    <!-- ══ SCREEN 2: LOGIN / REGISTER ══ -->
    <div class="screen" id="screenLogin">

      <div class="login-header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="role-badge">
          <div class="role-badge-emoji" id="badgeEmoji">🐶</div>
          <div class="role-badge-info">
            <div class="role-badge-label">Entering as</div       <div class="role-badge-name c-waffle" id="badgeName">Waffle</div>
          </div>
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active t-waffle" id="tabLogin" onclick="selectMode('login')">Log In</button>
        <button class="mode-tab t-waffle" id="tabRegister" onclick="selectMode('register')">Sign Up</button>
      </div>

      <div class="form" id="loginForm">
        <div class="field name-field" id="nameField">
          <div class="field-label">Name</div>
          <input class="field-input fi-waffle" id="inputName" type="text" placeholder="Your name" autocomplete="name" />
        </div>
        <div class="field">
          <div class="field-label">Email</div>
          <input class="field-input fi-waffle" id="inputEmail" type="email" placeholder="you@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <div class="field-label">Password</div>
          <input class="field-input fi-waffle" id="inputPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-submit s-waffle" id="submitBtn" onclick="handleSubmit()">Log In as Waffle</button>
      </div>

      <div class="footer" style="margin-top:20px;">
        By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
      </div>

    </div>

  </div><!-- /.app -->

  <script>
    var role = 'waffle';
    var mode = 'login';

    function goToLogin(selectedRole, selectedMode) {
      role = selectedRole;
      mode = selectedMode || 'register';
      applyState();
      document.getElementById('screenRole').classList.add('out');
      document.getElementById('screenLogin').classList.add('in');
    }

    function goBack() {
      document.getElementById('screenRole').classList.remove('out');
      document.getElementById('screenLogin').classList.remove('in');
    }

    function selectMode(m) {
      mode = m;
      applyState();
    }

    function applyState() {
      var isWaffle = (role === 'waffle');
      var isLogin  = (mode === 'login');
      var colorCls = isWaffle ? 'c-waffle' : 'c-bestie';
      var tabCls   = isWaffle ? 't-waffle' : 't-bestie';
      var inputCls = isWaffle ? 'fi-waffle' : 'fi-bestie';
      var btnCls   = isWaffle ? 's-waffle'  : 's-bestie';

      // Badge
      document.getElementById('badgeEmoji').textContent = isWaffle ? '🐶' : '🦺';
      var badgeName = document.getElementById('badgeName');
      badgeName.textContent = isWaffle ? 'Waffle' : 'Bestie';
      badgeName.className = 'role-badge-name ' + colorCls;

      // Mode tabs
      var tL = document.getElementById('tabLogin');
      var tR = document.getElementById('tabRegister');
      tL.className = 'mode-tab ' + tabCls + (isLogin ? ' active' : '');
      tR.className = 'mode-tab ' + tabCls + (!isLogin ? ' active' : '');

      // Name field
      document.getElementById('nameField').classList.toggle('show', !isLogin);

      // Input focus colors
      var inputs = document.querySelectorAll('.field-input');
      inputs.forEach(function(inp) {
        inp.classList.remove('fi-waffle', 'fi-bestie');
        inp.classList.add(inputCls);
      });

      // Submit button
      var btn = document.getElementById('submitBtn');
      btn.className = 'btn-submit ' + btnCls;
      btn.textContent = (isLogin ? 'Log In' : 'Sign Up') + ' as ' + (isWaffle ? 'Waffle' : 'Bestie');

      // Password autocomplete hint
      document.getElementById('inputPassword').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
    }

    function handleSubmit() {
      alert((mode === 'login' ? 'Login' : 'Sign up') + ' coming soon! 🐾');
    }
  </script>
